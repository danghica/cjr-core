<text x="18" y="80">block_sum · n=4,096</text>
<g><title>CJR: median 0.6908, Q1 0.6771, Q3 0.6939 ns/op</title><path d="M 864.3 90 H 880.0" stroke="#176f76" stroke-width="2"/><circle cx="877.0" cy="90" r="4" fill="#176f76"/><text x="900" y="94">CJR 0.69 ns/op</text></g>
<g><title>Handwritten: median 0.3381, Q1 0.3378, Q3 0.3389 ns/op</title><path d="M 546.4 110 H 547.4" stroke="#de8b37" stroke-width="2"/><circle cx="546.7" cy="110" r="4" fill="#de8b37"/><text x="900" y="114">Handwritten 0.34 ns/op</text></g>
</svg>
