<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 176" role="img">
<title>block_sum benchmark medians and IQR</title>
<style>text{font:12px system-ui;fill:#26333a}.axis{stroke:#9aa7aa}.grid{stroke:#e4e9e9}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="20" y="24" font-size="17">block_sum · median and IQR</text>
<circle cx="250" cy="44" r="5" fill="#176f76"/><text x="260" y="48">CJR</text>
<circle cx="400" cy="44" r="5" fill="#de8b37"/><text x="410" y="48">Handwritten</text>
<path d="M 230.0 65 V 141" class="grid"/><text x="230.0" y="159" text-anchor="middle">0.00</text>
<path d="M 392.5 65 V 141" class="grid"/><text x="392.5" y="159" text-anchor="middle">0.17</text>
<path d="M 555.0 65 V 141" class="grid"/><text x="555.0" y="159" text-anchor="middle">0.35</text>
<path d="M 717.5 65 V 141" class="grid"/><text x="717.5" y="159" text-anchor="middle">0.52</text>
<path d="M 880.0 65 V 141" class="grid"/><text x="880.0" y="159" text-anchor="middle">0.69</text>
